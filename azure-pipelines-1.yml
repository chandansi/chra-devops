trigger:
  - bckinfra

pool: target_agent


stages:
  - stage: PreBuild
    displayName: "Pre-Build"
    jobs:
      - job: BuildJob
        displayName: "Terraform Init/Validate/Fmt"
        steps:

          - task: TerraformTask@5
            inputs:
              provider: 'azurerm'
              command: 'init'
              workingDirectory: '$(System.DefaultWorkingDirectory)/environment/dev'
              backendServiceArm: 'taget30'
              backendAzureRmResourceGroupName: "fuddu-rg"
              backendAzureRmStorageAccountName: 'fuddustorageacc'
              backendAzureRmContainerName: 'fudducontainer'
              backendAzureRmKey: 'fuddu.terraform.tfstate'

          - task: TerraformTask@5
            inputs:
              provider: 'azurerm'
              command: 'validate'
              workingDirectory: '$(System.DefaultWorkingDirectory)/environment/dev'

          - task: TerraformTask@5
            inputs:
              provider: 'azurerm'
              command: 'custom'
              workingDirectory: '$(System.DefaultWorkingDirectory)/environment/dev'
              outputTo: 'console'
              customCommand: 'fmt'
              environmentServiceNameAzureRM: 'taget30'

  - stage: ScanTool
    dependsOn: PreBuild
    displayName: "Scanning Tool"
    jobs:
      - job: Scan_TFSec
        displayName: "Run TFSec Scan"

        steps:
          - task: tfsec@1
            inputs:
              version: 'v1.26.0'
              dir: '$(System.DefaultWorkingDirectory)/environment/dev'

      - job: Scan_TFLint
        displayName: "Run TFLint Scan"
        
        steps:
          - task: PowerShell@2
            continueOnError: true
            inputs:
              targetType: 'inline'
              script: |
                tflint 
                
              workingDirectory: '$(System.DefaultWorkingDirectory)/environment/dev'
  - stage: Plan 
    displayName: "cost & review tool"
    dependsOn: ScanTool
    jobs:
      - job: Terraformplan  
        displayName: "Terraform plan"
        pool: target_agent
        steps:
          - task: TerraformTask@5
            inputs:
              provider: 'azurerm'
              command: 'init'
              workingDirectory: '$(System.DefaultWorkingDirectory)/environment/dev'
              backendServiceArm: 'taget30'
              backendAzureRmResourceGroupName: "fuddu-rg"
              backendAzureRmStorageAccountName: 'fuddustorageacc'
              backendAzureRmContainerName: 'fudducontainer'
              backendAzureRmKey: 'fuddu.terraform.tfstate'
          - task: TerraformTask@5
            inputs:
              provider: 'azurerm'
              command: 'plan'
              workingDirectory: '$(System.DefaultWorkingDirectory)/environment/dev'
              environmentServiceNameAzureRM: 'taget30'



  - stage: Apply
    displayName: "approval & governance"
    jobs:
      - job: apply
        pool: target_agent
        steps:

          - task: TerraformTask@5
            inputs:
              provider: 'azurerm'
              command: 'init'
              workingDirectory: '$(System.DefaultWorkingDirectory)/environment/dev'
              backendServiceArm: 'taget30'
              backendAzureRmResourceGroupName: "fuddu-rg"
              backendAzureRmStorageAccountName: 'fuddustorageacc'
              backendAzureRmContainerName: 'fudducontainer'
              backendAzureRmKey: 'fuddu.terraform.tfstate'
          - task: TerraformTask@5
            inputs:
              provider: 'azurerm'
              command: 'apply'
              workingDirectory: '$(System.DefaultWorkingDirectory)/environment/dev'
              environmentServiceNameAzureRM: 'taget30'






